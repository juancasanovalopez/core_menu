[package]
name        = "core_menu"
version     = "1.0.0"
edition     = "2021"
description = "Gestor de sistema Linux con menú TUI interactivo en la terminal"
authors     = ["Alfred"]

# ─────────────────────────────────────────────────────────────────
#  DEPENDENCIAS
#  ratatui  → marco TUI (funciona sobre crossterm)
#  crossterm→ backend de terminal multiplataforma (lectura de eventos)
#  anyhow   → gestión de errores ergonómica
# ─────────────────────────────────────────────────────────────────
[dependencies]
ratatui   = "0.26"
crossterm = "0.27"
anyhow    = "1.0"
libc      = "0.2"
reqwest   = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver    = { version = "1.0", features = ["serde"] }
sha2      = "0.10"
ssh-key   = { version = "0.6", features = ["ed25519"] }
tempfile  = "3.10"
