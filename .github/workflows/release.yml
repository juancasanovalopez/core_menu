name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/validate_release.py "$TAG"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            machine: Advanced Micro Devices X86-64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            machine: AArch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install native musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test and build
        env:
          TARGET: ${{ matrix.target }}
          CC: musl-gcc
        run: |
          cargo test --locked --target "$TARGET"
          cargo build --locked --release --target "$TARGET"
      - name: Verify static executable and architecture
        env:
          TARGET: ${{ matrix.target }}
          MACHINE: ${{ matrix.machine }}
          TAG: ${{ github.ref_name }}
        run: |
          binary="target/$TARGET/release/core_menu"
          readelf -h "$binary" | grep -F "$MACHINE"
          if readelf -l "$binary" | grep -q INTERP; then
            echo "::error::Release executable is not static"
            exit 1
          fi
          test "$("$binary" --version)" = "core_menu ${TAG#v}"
          mkdir -p dist
          cp "$binary" "dist/core_menu-$TAG-$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate manifests
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = os.environ["TAG"][1:]
          for target in ("x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"):
              asset = f"core_menu-v{version}-{target}"
              binary = Path("dist", asset).read_bytes()
              assert 0 < len(binary) <= 64 * 1024 * 1024, "Binary exceeds updater limits"
              manifest = dict(schema=1, version=version, target=target, asset=asset,
                              size=len(binary), sha256=hashlib.sha256(binary).hexdigest())
              data = json.dumps(manifest, separators=(",", ":")).encode()
              assert len(data) <= 16 * 1024
              Path("dist", f"update-manifest-{target}.json").write_bytes(data)
          PY
      - name: Sign and verify manifests
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/core_menu-signing-key"
          signers="$RUNNER_TEMP/core_menu-allowed-signers"
          trap 'rm -f "$key" "$signers"' EXIT
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::Missing UPDATE_SIGNING_KEY secret"; exit 1; }
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$key"
          actual="$(ssh-keygen -y -P '' -f "$key" | awk '{print $1 " " $2}')"
          expected="$(awk '{print $1 " " $2}' config/update-public-key.pub)"
          test "$actual" = "$expected" || { echo "::error::Signing key does not match embedded public key"; exit 1; }
          test "${actual%% *}" = ssh-ed25519
          printf 'core_menu %s\n' "$actual" > "$signers"
          for manifest in dist/update-manifest-*.json; do
            ssh-keygen -Y sign -f "$key" -n core_menu-release "$manifest"
            mv "$manifest.sig" "${manifest%.json}.sig"
            ssh-keygen -Y verify -f "$signers" -I core_menu -n core_menu-release \
              -s "${manifest%.json}.sig" < "$manifest"
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          gh release create "$TAG" dist/* --verify-tag --draft --title "$TAG" --generate-notes
          gh release edit "$TAG" --draft=false --latest
      - name: Complete release PR lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          prs="$(gh api --paginate "repos/$GH_REPO/commits/$RELEASE_SHA/pulls" \
            --jq '.[] | select(.merged_at != null) | select(any(.labels[]; .name == "autorelease: pending")) | .number')"
          for pr in $prs; do
            gh pr edit "$pr" --remove-label "autorelease: pending"
          done
